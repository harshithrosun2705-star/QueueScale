apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queuescale-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harshithrosun2705-star/QueueScale.git
    targetRevision: main
    path: deploy/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: queuescale-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
